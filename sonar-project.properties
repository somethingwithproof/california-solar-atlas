# Project identity verified against the existing public SonarCloud project.
sonar.projectKey=somethingwithproof_california-solar-atlas
sonar.organization=somethingwithproof
sonar.sources=src,scripts,vite.config.js
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.mjs,tests/test_*.py
sonar.exclusions=**/node_modules/**,**/dist/**,**/dist-data/**,**/public/data/**,**/__pycache__/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
# Dependency review and npm audit own dependency scanning here. Prevent optional
# Sonar SCA from invoking project build tools inside the credential-bearing job.
sonar.sca.enabled=false
# Executed scans report real quality-gate failures. The check is optional in GitHub.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
