name: Validate application

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      # Fails on any advisory. The dev tree is the build-time supply chain for a
      # static site, so a moderate finding there still warrants a look.
      - run: npm audit

  validate-release-assets:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-data-release.txt
      - run: python -m pip install --require-hashes --requirement requirements-data-release.txt
      - run: python -m unittest discover --start-directory tests --pattern 'test_*.py'
      - run: python scripts/export-parquet.py
      - run: (cd dist-data && sha256sum --check SHA256SUMS)
      - run: python scripts/validate-parquet.py
