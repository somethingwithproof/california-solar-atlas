name: Propose statewide data refresh

on:
  schedule:
    - cron: "23 10 15 * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh
    timeout-minutes: 90
    permissions:
      contents: write # Push the generated data to a review branch.
      pull-requests: write # Propose the validated refresh as a PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download authoritative sources
        run: |
          source_dir=$(mktemp -d "$RUNNER_TEMP/atlas-sources.XXXXXX")
          {
            echo "CA_CITY_CSV=$source_dir/ca-cities.csv"
            echo "CA_DG_ZIP=$source_dir/ca-dg-projects.zip"
            echo "CA_POPULATION_XLSX=$source_dir/ca-population-2026.xlsx"
            echo "CA_GAZETTEER=$source_dir/ca-place-gazetteer.txt"
            echo "CA_CLIMATE_ZONES=$source_dir/ca-climate-zones.geojson"
            echo "CA_CITY_GEOJSON=$source_dir/ca-city-boundaries.geojson"
          } >> "$GITHUB_ENV"
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 3 'https://gis.data.ca.gov/api/download/v1/items/8cd5d2038c5547ba911eea7bec48e28b/csv?layers=2' --output "$source_dir/ca-cities.csv"
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 3 'https://www.californiadgstats.ca.gov/download/interconnection_rule21_projects/' --output "$source_dir/ca-dg-projects.zip"
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 3 'https://dof.ca.gov/media/docs/forecasting/Demographics/estimates-e1/E-1_2026_InternetVersion.xlsx' --output "$source_dir/ca-population-2026.xlsx"
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 3 'https://www2.census.gov/geo/docs/maps-data/data/gazetteer/2024_Gazetteer/2024_gaz_place_06.txt' --output "$source_dir/ca-place-gazetteer.txt"
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 3 'https://services3.arcgis.com/bWPjFyq029ChCGur/arcgis/rest/services/BuildingClimateZones_CEC_2015/FeatureServer/0/query?where=1%3D1&outFields=*&returnGeometry=true&outSR=4326&f=geojson' --output "$source_dir/ca-climate-zones.geojson"
          for _ in 1 2 3 4 5 6; do
            curl --proto '=https' --proto-redir '=https' --fail --location --retry 3 'https://gis.data.ca.gov/api/download/v1/items/8cd5d2038c5547ba911eea7bec48e28b/geojson?layers=2' --output "$source_dir/ca-city-boundaries.geojson"
            if jq --exit-status '.features | length > 0' "$source_dir/ca-city-boundaries.geojson" >/dev/null 2>&1; then break; fi
            sleep 20
          done
          jq --exit-status '.features | length > 0' "$source_dir/ca-city-boundaries.geojson" >/dev/null
      - name: Aggregate and validate
        run: |
          npm run data:build
          npm run data:boundaries
          npm test
          npm run build
      - name: Open reviewable update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/data/cities.json public/data/boundaries.json; then
            echo 'No source changes detected.'
            exit 0
          fi
          branch="data-refresh-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          git switch -c "$branch"
          git add public/data/cities.json public/data/boundaries.json
          git commit -m 'Refresh statewide solar data'
          git push --set-upstream origin "$branch"
          gh pr create --title 'Refresh statewide solar data' --body 'Automated source refresh. Validation and production build passed. Review capacity deltas, coverage flags, and source vintage before merging.' --base main --head "$branch"
